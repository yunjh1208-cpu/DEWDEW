name: Build MLB All-Time Draft Data
on:
  push:
    branches: [main]
    paths:
      - 'mlb-draft/index.html'
      - 'mlb-draft/app.js'
      - 'mlb-draft/styles.css'
      - 'mlb-draft/build_players.py'
      - '.github/workflows/deploy-mlb-draft.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-draft-data
  cancel-in-progress: true

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build player database
        run: |
          python -m pip install --disable-pip-version-check pandas
          python mlb-draft/build_players.py
      - name: Commit generated player data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mlb-draft/data/players.json
          if ! git diff --cached --quiet; then
            git commit -m "Build MLB player data [skip ci]"
            git push
          fi
